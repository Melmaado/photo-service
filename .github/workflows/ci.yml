name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.6"
      - name: Install dependencies
        run: pip install -r requirements/requirements-dev.txt
      - name: Begin test
        run: pytest
  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t ghcr.io/melmaado/photo-service:${{ github.sha }} .
      - name: Push the image
        run: docker push ghcr.io/melmaado/photo-service:${{ github.sha }}
  deploy-test:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set image tag
        run: cd manifests/overlays/online-test && kustomize edit set image photo-service=ghcr.io/melmaado/photo-service:${{ github.sha }}
      - name: Deploy to online test
        run: kubectl apply -k manifests/overlays/online-test --context team1@cluster-sc
      - name: Wait for rollout
        run: kubectl rollout status deployment/photo-service-test -n team1 --context team1@cluster-sc --timeout=300s

  deploy-prod:
    needs: deploy-test
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set image tag
        run: cd manifests/overlays/online-prod && kustomize edit set image photo-service=ghcr.io/melmaado/photo-service:${{ github.sha }}
      - name: Deploy to online prod
        run: kubectl apply -k manifests/overlays/online-prod --context team1@cluster-sc
      - name: Wait for rollout
        run: kubectl rollout status deployment/photo-service-prod -n team1 --context team1@cluster-sc --timeout=300s