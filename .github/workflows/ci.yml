name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Python setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.6"
      - name: Install dependencies
        run: pip install -r requirements/requirements-dev.txt
      - name: Begin test
        run: pytest
  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t ghcr.io/melmaado/photo-service:${{ github.sha }} .
      - name: Push the image
        run: docker push ghcr.io/melmaado/photo-service:${{ github.sha }}
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Tag update
        run: cd manifests/overlays/test && kustomize edit set image photo-service=ghcr.io/melmaado/photo-service:${{ github.sha }}
      - name: Application of modifications
        run: kubectl apply -k manifests/overlays/test
      - name: Status check
        run: kubectl rollout status deployment/photo-service -n 21359-test --timeout=120s