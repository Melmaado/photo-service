apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/
  - ../../local-ingress
namespace: 21359-dev
patches:
  - target:
      kind: Ingress
      name: photo-service
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: dev.photo.localhost
  - target:
      kind: Deployment
      name: photo-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
secretGenerator:
  - name: photo-secrets
    literals:
      - POSTGRES_PASSWORD=local-db-password
      - SECRET_KEY=local-secret-key

images:
  - name: photo-service
    newName: ghcr.io/melmaado/photo-service
    newTag: ac5801ad96f8168361e53e21b9cc061c44edb6d9