apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/
  - ../../local-ingress
namespace: 21359-dev
patches:
  - target:
      kind: Ingress
      name: photo-service
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: dev.photo.localhost

secretGenerator:
  - name: photo-secrets
    literals:
      - POSTGRES_PASSWORD=local-db-password
      - SECRET_KEY=local-secret-key

images:
  - name: photo-service
    newTag: "1.4"