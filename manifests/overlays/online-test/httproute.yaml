  namespace: team1
spec:
  parentRefs:
    - name: main-gateway
      namespace: infra
  hostnames:
    - team1.laboinfo-ecam.be
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test
      backendRefs:
        - name: photo-service-test
          port: 8080