apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          env:
            - name: DB_HOST_0
              value: postgres-test-0.postgres-test
            - name: DB_HOST_1
              value: postgres-shard1-test-0.postgres-shard1-test
      containers:
        - name: photo-service
          env:
            - name: DB_HOST_0
              value: postgres-test-0.postgres-test
            - name: DB_HOST_1
              value: postgres-shard1-test-0.postgres-shard1-test
            - name: REDIS_URL
              value: redis://redis-test-0.redis-test:6379/0
            - name: URL_PREFIX
              value: /test