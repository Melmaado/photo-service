apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/
namespace: team1
nameSuffix: -test
labels:
  - pairs:
      env: test
    includeSelectors: true
patches:
  - target:
      kind: Deployment
      name: photo-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
images:
  - name: photo-service
    newName: ghcr.io/melmaado/photo-service
    newTag: fff489d0edf820f3a0d379a3492129c1db16a5ec