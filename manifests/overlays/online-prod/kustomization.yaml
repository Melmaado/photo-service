apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/
  - httproute.yaml
namespace: team1
nameSuffix: -prod
labels:
  - pairs:
      env: prod
    includeSelectors: true
patches:
  - target:
      kind: Deployment
      name: photo-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - path: patch-env.yaml
images:
  - name: photo-service
    newName: ghcr.io/melmaado/photo-service
    newTag: 1019052436af7d1cc72bd007e0bfbf12d0234dea