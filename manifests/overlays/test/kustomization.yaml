apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/
  - ../../local-ingress
namespace: 21359-test
patches:
  - target:
      kind: Ingress
      name: photo-service
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: test.photo.localhost
  - target:
      kind: Deployment
      name: photo-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
        
images:
  - name: photo-service
    newName: ghcr.io/melmaado/photo-service
    newTag: 3431ecd978474ffb8ae092f6249ca0c3b115605d