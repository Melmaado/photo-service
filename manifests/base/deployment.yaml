apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: photo-service
  template:
    metadata:
      labels:
        app: photo-service
    spec:
      initContainers:
        - name: migrate
          image: photo-service:1.3
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photo-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: postgres-0.postgres
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@$(DB_HOST):5432/photo
      containers:
        - name: photo-service
          image: photo-service:1.3
          imagePullPolicy: Never
          ports:
          - containerPort: 8080
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: photo-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: postgres-0.postgres
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@$(DB_HOST):5432/photo
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: photo-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: "/health"
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: "/health"
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10