apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: photo-service
  template:
    metadata:
      labels:
        app: photo-service
    spec:
      containers:
        - name: photo-service
          image: photo-service:1.3
          imagePullPolicy: Never
          ports:
          - containerPort: 8080
          readinessProbe:
            httpGet:
              path: "/health"
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: "/health"
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10