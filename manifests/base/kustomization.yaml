apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - service-headless.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - postgres-shard1-service.yaml
  - postgres-shard1-statefulset.yaml
secretGenerator:
  - name: postgres-init
    files:
      - postgres-init/allow-replication.sh
generatorOptions:
  disableNameSuffixHash: true