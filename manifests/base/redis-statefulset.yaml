apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4
          command:
            - sh
            - -c
            - |
              ORDINAL="${HOSTNAME##*-}"
              NAME="${HOSTNAME%-*}"
              ARGS="--maxmemory 100mb --maxmemory-policy allkeys-lru --save '' --appendonly no"
              if [ "$ORDINAL" = "0" ]; then
                exec sh -c "redis-server $ARGS"
              else
                exec sh -c "redis-server $ARGS --replicaof ${NAME}-0.${NAME} 6379"
              fi
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5