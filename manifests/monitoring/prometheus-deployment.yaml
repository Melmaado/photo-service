apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
          - --config.file=/etc/prometheus/prometheus.yml
          ports:
          - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: prometheus-volume-config
              mountPath: /etc/prometheus
            - name: prometheus-volume-data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: "/-/ready"
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: "/-/healthy"
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: prometheus-volume-config
          secret:
            secretName: prometheus-config
        - name: prometheus-volume-data
          emptyDir: {}