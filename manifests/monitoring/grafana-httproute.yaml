apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: team1
spec:
  parentRefs:
    - name: main-gateway
      namespace: infra
  hostnames:
    - team1.laboinfo-ecam.be
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grafana
      backendRefs:
        - name: grafana
          port: 3000
