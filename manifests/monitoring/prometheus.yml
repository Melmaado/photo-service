global:
  scrape_interval: 15s
scrape_configs:
  - job_name: photo-service-prod
    dns_sd_configs:
      - names:
          - photo-service-headless-prod.team1.svc.cluster.local
        type: A
        port: 8080
  - job_name: photo-service-test
    dns_sd_configs:
      - names:
          - photo-service-headless-test.team1.svc.cluster.local
        type: A
        port: 8080