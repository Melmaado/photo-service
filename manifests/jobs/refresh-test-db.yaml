apiVersion: v1
kind: Pod
metadata:
  name: refresh-test-db
  namespace: team1
spec:
  restartPolicy: Never
  containers:
    - name: refresh
      image: postgres:17
      command: ["bash", "/scripts/refresh-test-db.sh"]
      env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: photo-secrets
              key: POSTGRES_PASSWORD
        - name: PROD_URL_0
          value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-prod-0.postgres-prod:5432/photo
        - name: PROD_URL_1
          value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-shard1-prod-0.postgres-shard1-prod:5432/photo
        - name: TEST_URL_0
          value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-test-0.postgres-test:5432/photo
        - name: TEST_URL_1
          value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres-shard1-test-0.postgres-shard1-test:5432/photo
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 256Mi
      volumeMounts:
        - name: scripts
          mountPath: /scripts
  volumes:
    - name: scripts
      secret:
        secretName: refresh-test-db-script